<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Associação Rural Ivoti</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        header {
            background: linear-gradient(135deg, #2c5f2d, #1a3a1b);
            color: white;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        header h1 { font-size: 28px; margin-bottom: 0.5rem; }
        header p { font-size: 14px; opacity: 0.9; }
        .logo { width: 60px; height: 60px; margin: 0 auto 1rem; background: rgba(255,255,255,0.1); border-radius: 8px; }
        
        nav {
            display: flex;
            gap: 0;
            background: white;
            border-bottom: 1px solid #ddd;
            overflow-x: auto;
        }
        .nav-btn {
            flex: 1;
            padding: 12px 16px;
            background: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
            color: #666;
        }
        .nav-btn.active {
            background: #2c5f2d;
            color: white;
            border-bottom-color: #2c5f2d;
        }
        .nav-btn:hover:not(.active) { background: #f0f0f0; }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .tab { display: none; }
        .tab.active { display: block; }
        
        .card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .card h3 { margin-bottom: 1rem; color: #2c5f2d; }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        textarea { resize: vertical; min-height: 100px; }
        
        button {
            background: #2c5f2d;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            margin-right: 8px;
        }
        button:hover { background: #1a3a1b; }
        button.secondary {
            background: #666;
        }
        button.secondary:hover { background: #444; }
        button.danger {
            background: #d9534f;
        }
        button.danger:hover { background: #c9302c; }
        
        .member-item, .arquivo-item, .pagamento-item, .despesa-item {
            background: #f9f9f9;
            padding: 1rem;
            margin: 8px 0;
            border-radius: 4px;
            border-left: 4px solid #2c5f2d;
        }
        
        .member-item p, .arquivo-item p, .pagamento-item p, .despesa-item p {
            margin: 4px 0;
            font-size: 13px;
        }
        .member-item strong, .arquivo-item strong, .pagamento-item strong, .despesa-item strong {
            color: #2c5f2d;
        }
        
        .totals {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin: 1rem 0;
        }
        .total-box {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 4px;
            text-align: center;
        }
        .total-box p { font-size: 12px; color: #666; margin-bottom: 0.5rem; }
        .total-box strong { font-size: 24px; color: #2c5f2d; }
        
        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 1rem;
        }
        .button-group button { flex: 1; }
    </style>
</head>
<body>
    <header>
        <div class="logo"></div>
        <h1>🌾 Painel Associação Rural Ivoti</h1>
        <p>Sabores e Experiências</p>
    </header>

    <nav>
        <button class="nav-btn active" onclick="mudarAba('membros')">👥 Membros Diretoria</button>
        <button class="nav-btn" onclick="mudarAba('atas')">📋 Ata da Reunião</button>
        <button class="nav-btn" onclick="mudarAba('arquivos')">📁 Arquivos Compartilhados</button>
        <button class="nav-btn" onclick="mudarAba('financeiro')">💰 Financeiro</button>
        <button class="nav-btn" onclick="mudarAba('despesas')">💸 Despesas</button>
    </nav>

    <div class="container">
        <!-- ABA: MEMBROS -->
        <div id="membros" class="tab active">
            <div class="card">
                <h3>Adicionar Membro</h3>
                <input type="text" id="nomeMembro" placeholder="Nome completo">
                <input type="text" id="cargoMembro" placeholder="Cargo (ex: Presidente)">
                <input type="text" id="contatoMembro" placeholder="Contato WhatsApp (ex: 5551999999999)">
                <button onclick="adicionarMembro()">+ Adicionar Membro</button>
            </div>
            <div class="card" id="listaMembros"></div>
        </div>

        <!-- ABA: ATAS -->
        <div id="atas" class="tab">
            <div class="card">
                <h3>Registrar Ata</h3>
                <input type="date" id="dataAta">
                <input type="text" id="responsavelAta" placeholder="Responsável">
                <textarea id="conteudoAta" placeholder="Conteúdo da reunião..."></textarea>
                <button onclick="salvarAta()">💾 Salvar Ata</button>
            </div>
            <div class="card" id="listaAtas"></div>
        </div>

        <!-- ABA: ARQUIVOS -->
        <div id="arquivos" class="tab">
            <div class="card">
                <h3>Compartilhar Arquivo</h3>
                <input type="text" id="tituloArquivo" placeholder="Título">
                <textarea id="descricaoArquivo" placeholder="Descrição..."></textarea>
                <select id="categoriaArquivo">
                    <option value="">Categoria</option>
                    <option value="ata">Ata</option>
                    <option value="financeiro">Financeiro</option>
                    <option value="projeto">Projeto</option>
                    <option value="marketing">Marketing</option>
                    <option value="outro">Outro</option>
                </select>
                <button onclick="adicionarArquivo()">📤 Compartilhar</button>
            </div>
            <div class="card" id="listaArquivos"></div>
        </div>

        <!-- ABA: FINANCEIRO -->
        <div id="financeiro" class="tab">
            <div class="card">
                <h3>Registrar Pagamento</h3>
                <select id="membroPagamento">
                    <option value="">Selecione um membro</option>
                </select>
                <input type="number" id="valorPagamento" placeholder="Valor (R$)" step="0.01">
                <input type="date" id="dataPagamento">
                <button onclick="registrarPagamento()">✓ Registrar</button>
            </div>
            <div class="card" id="listaPagamentos"></div>
        </div>

        <!-- ABA: DESPESAS -->
        <div id="despesas" class="tab">
            <div class="card">
                <h3>Registrar Despesa</h3>
                <input type="text" id="descricaoDespesa" placeholder="Descrição">
                <input type="number" id="valorDespesa" placeholder="Valor (R$)" step="0.01">
                <input type="date" id="dataDespesa">
                <input type="file" id="comprovanteDespesa" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx">
                <button onclick="registrarDespesa()">💾 Registrar Despesa</button>
            </div>
            <div class="totals" id="totalDespesas"></div>
            <div class="card" id="listaDespesas"></div>
        </div>
    </div>

    <script>
        // Dados
        let dados = {
            membros: [],
            atas: [],
            arquivos: [],
            pagamentos: [],
            despesas: []
        };

        // Carregar dados do localStorage
        function carregarDados() {
            const salvo = localStorage.getItem('painel-ivoti');
            if (salvo) {
                dados = JSON.parse(salvo);
            }
        }

        // Salvar dados
        function salvarDados() {
            localStorage.setItem('painel-ivoti', JSON.stringify(dados));
        }

        // Mudar aba
        function mudarAba(aba) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(aba).classList.add('active');
            event.target.classList.add('active');
            atualizarAba(aba);
        }

        // Atualizar conteúdo das abas
        function atualizarAba(aba) {
            if (aba === 'membros') atualizarMembros();
            else if (aba === 'atas') atualizarAtas();
            else if (aba === 'arquivos') atualizarArquivos();
            else if (aba === 'financeiro') { atualizarMembrosFinanceiro(); atualizarPagamentos(); }
            else if (aba === 'despesas') atualizarDespesas();
        }

        // MEMBROS
        function adicionarMembro() {
            const nome = document.getElementById('nomeMembro').value.trim();
            const cargo = document.getElementById('cargoMembro').value.trim();
            const contato = document.getElementById('contatoMembro').value.trim();
            if (!nome || !cargo) return alert('Preencha nome e cargo');
            
            dados.membros.push({ id: Date.now(), nome, cargo, contato });
            salvarDados();
            document.getElementById('nomeMembro').value = '';
            document.getElementById('cargoMembro').value = '';
            document.getElementById('contatoMembro').value = '';
            atualizarMembros();
        }

        function atualizarMembros() {
            const lista = document.getElementById('listaMembros');
            if (dados.membros.length === 0) {
                lista.innerHTML = '<p style="color:#999;">Nenhum membro registrado</p>';
                return;
            }
            lista.innerHTML = dados.membros.map(m => `
                <div class="member-item">
                    <strong>${m.nome}</strong> <span style="color:#666;">— ${m.cargo}</span>
                    ${m.contato ? `<p>📱 <a href="https://wa.me/55${m.contato.replace(/\D/g, '')}" target="_blank">${m.contato}</a></p>` : ''}
                    <button class="danger" onclick="removerMembro(${m.id})" style="margin-top:8px;">✕ Remover</button>
                </div>
            `).join('');
        }

        function removerMembro(id) {
            dados.membros = dados.membros.filter(m => m.id !== id);
            salvarDados();
            atualizarMembros();
        }

        // ATAS
        function salvarAta() {
            const data = document.getElementById('dataAta').value;
            const responsavel = document.getElementById('responsavelAta').value.trim();
            const conteudo = document.getElementById('conteudoAta').value.trim();
            if (!data || !responsavel || !conteudo) return alert('Preencha todos os campos');
            
            dados.atas.push({ id: Date.now(), data, responsavel, conteudo });
            salvarDados();
            document.getElementById('dataAta').value = '';
            document.getElementById('responsavelAta').value = '';
            document.getElementById('conteudoAta').value = '';
            atualizarAtas();
        }

        function atualizarAtas() {
            const lista = document.getElementById('listaAtas');
            if (dados.atas.length === 0) {
                lista.innerHTML = '<p style="color:#999;">Nenhuma ata registrada</p>';
                return;
            }
            lista.innerHTML = dados.atas.map(a => `
                <div class="member-item">
                    <strong>${new Date(a.data).toLocaleDateString('pt-BR')}</strong> por <strong>${a.responsavel}</strong>
                    <p>${a.conteudo}</p>
                    <button class="danger" onclick="removerAta(${a.id})" style="margin-top:8px;">✕ Remover</button>
                </div>
            `).join('');
        }

        function removerAta(id) {
            dados.atas = dados.atas.filter(a => a.id !== id);
            salvarDados();
            atualizarAtas();
        }

        // ARQUIVOS
        function adicionarArquivo() {
            const titulo = document.getElementById('tituloArquivo').value.trim();
            const descricao = document.getElementById('descricaoArquivo').value.trim();
            const categoria = document.getElementById('categoriaArquivo').value;
            if (!titulo || !categoria) return alert('Preencha título e categoria');
            
            dados.arquivos.push({ id: Date.now(), titulo, descricao, categoria });
            salvarDados();
            document.getElementById('tituloArquivo').value = '';
            document.getElementById('descricaoArquivo').value = '';
            document.getElementById('categoriaArquivo').value = '';
            atualizarArquivos();
        }

        function atualizarArquivos() {
            const lista = document.getElementById('listaArquivos');
            if (dados.arquivos.length === 0) {
                lista.innerHTML = '<p style="color:#999;">Nenhum arquivo compartilhado</p>';
                return;
            }
            lista.innerHTML = dados.arquivos.map(a => `
                <div class="arquivo-item">
                    <strong>${a.titulo}</strong> <span style="color:#999;">— ${a.categoria}</span>
                    ${a.descricao ? `<p>${a.descricao}</p>` : ''}
                    <button class="danger" onclick="removerArquivo(${a.id})" style="margin-top:8px;">✕ Remover</button>
                </div>
            `).join('');
        }

        function removerArquivo(id) {
            dados.arquivos = dados.arquivos.filter(a => a.id !== id);
            salvarDados();
            atualizarArquivos();
        }

        // FINANCEIRO
        function atualizarMembrosFinanceiro() {
            const select = document.getElementById('membroPagamento');
            select.innerHTML = '<option value="">Selecione um membro</option>' + 
                dados.membros.map(m => `<option value="${m.id}">${m.nome}</option>`).join('');
        }

        function registrarPagamento() {
            const membroid = document.getElementById('membroPagamento').value;
            const valor = parseFloat(document.getElementById('valorPagamento').value);
            const data = document.getElementById('dataPagamento').value;
            if (!membroid || !valor || !data) return alert('Preencha todos os campos');
            
            const membro = dados.membros.find(m => m.id == membroid);
            const contato = membro.contato;
            
            dados.pagamentos.push({ id: Date.now(), membroid, membro: membro.nome, valor, data, contato });
            salvarDados();
            document.getElementById('membroPagamento').value = '';
            document.getElementById('valorPagamento').value = '';
            document.getElementById('dataPagamento').value = '';
            
            if (contato) {
                const msg = `Olá ${membro.nome}! Seu pagamento de R$ ${valor.toFixed(2)} foi registrado em ${new Date(data).toLocaleDateString('pt-BR')}.`;
                window.open(`https://wa.me/55${contato.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
            }
            
            atualizarPagamentos();
        }

        function atualizarPagamentos() {
            const lista = document.getElementById('listaPagamentos');
            if (dados.pagamentos.length === 0) {
                lista.innerHTML = '<p style="color:#999;">Nenhum pagamento registrado</p>';
                return;
            }
            lista.innerHTML = dados.pagamentos.map(p => `
                <div class="pagamento-item">
                    <strong>${p.membro}</strong> — R$ ${p.valor.toFixed(2)}
                    <p>${new Date(p.data).toLocaleDateString('pt-BR')}</p>
                    <button class="danger" onclick="removerPagamento(${p.id})" style="margin-top:8px;">✕ Remover</button>
                </div>
            `).join('');
        }

        function removerPagamento(id) {
            dados.pagamentos = dados.pagamentos.filter(p => p.id !== id);
            salvarDados();
            atualizarPagamentos();
        }

        // DESPESAS
        function registrarDespesa() {
            const descricao = document.getElementById('descricaoDespesa').value.trim();
            const valor = parseFloat(document.getElementById('valorDespesa').value);
            const data = document.getElementById('dataDespesa').value;
            if (!descricao || !valor || !data) return alert('Preencha todos os campos');
            
            dados.despesas.push({ id: Date.now(), descricao, valor, data });
            salvarDados();
            document.getElementById('descricaoDespesa').value = '';
            document.getElementById('valorDespesa').value = '';
            document.getElementById('dataDespesa').value = '';
            document.getElementById('comprovanteDespesa').value = '';
            atualizarDespesas();
        }

        function atualizarDespesas() {
            const total = dados.despesas.reduce((sum, d) => sum + d.valor, 0);
            document.getElementById('totalDespesas').innerHTML = `
                <div class="total-box">
                    <p>Total de Despesas</p>
                    <strong>R$ ${total.toFixed(2)}</strong>
                </div>
                <div class="total-box">
                    <p>Registros</p>
                    <strong>${dados.despesas.length}</strong>
                </div>
            `;
            
            const lista = document.getElementById('listaDespesas');
            if (dados.despesas.length === 0) {
                lista.innerHTML = '<p style="color:#999;">Nenhuma despesa registrada</p>';
                return;
            }
            lista.innerHTML = dados.despesas.map(d => `
                <div class="despesa-item">
                    <strong>${d.descricao}</strong> — R$ ${d.valor.toFixed(2)}
                    <p>${new Date(d.data).toLocaleDateString('pt-BR')}</p>
                    <button class="danger" onclick="removerDespesa(${d.id})" style="margin-top:8px;">✕ Remover</button>
                </div>
            `).join('');
        }

        function removerDespesa(id) {
            dados.despesas = dados.despesas.filter(d => d.id !== id);
            salvarDados();
            atualizarDespesas();
        }

        // Inicializar
        carregarDados();
        atualizarMembros();
    </script>
</body>
</html>
